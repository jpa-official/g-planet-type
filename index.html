<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-PLANET Typography</title>
<style>
:root{--fg:#0a0a0a;--m55:rgba(10,10,10,.55);--m60:rgba(10,10,10,.6);--m70:rgba(10,10,10,.7);--l15:rgba(10,10,10,.15);--l20:rgba(10,10,10,.2);--paper:#fafafa;--track:#d6d6d6;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--fg);font:16px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;height:100vh}
.stage{position:relative;flex:1;min-width:0;background:#fff}
.tsvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
.tsvg [data-i]{cursor:pointer}
.toolbar{position:absolute;left:16px;top:16px;z-index:10;display:flex;align-items:center;gap:4px;padding:6px 8px;border:1px solid var(--l20);border-radius:8px;background:rgba(250,250,250,.85);font-size:12px}
.toolbar button{padding:4px 8px;border-radius:4px}
.toolbar button:hover{background:rgba(10,10,10,.07)}
.toolbar i{width:1px;height:16px;background:var(--l20);margin:0 4px}
.hint{position:absolute;left:16px;bottom:16px;z-index:10;max-width:320px;font-size:11px;color:rgba(10,10,10,.5);pointer-events:none}
.panel{width:384px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--l15);background:var(--paper)}
.top{padding:20px;border-bottom:1px solid var(--l15)}
.scroll{flex:1;overflow-y:auto;padding:20px}
h2{margin:0;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--m70)}
.top h2{margin-bottom:4px}
.sub{margin:0 0 12px;font-size:12px;color:var(--m55)}
textarea{width:100%;resize:vertical;min-height:96px;border:1px solid var(--l20);border-radius:4px;background:#fff;padding:8px;font:14px/1.45 var(--mono)}
.h2row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.h2row .sub{margin:4px 0 0;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.gap{height:12px}
.ctl{margin-bottom:16px}
.lab{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--m55)}
.lab output{color:var(--m70);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-4px;border:0}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:0}
.grid{display:grid;gap:8px;grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.tg{border:1px solid var(--l20);border-radius:4px;padding:6px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--m60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,border-color .12s}
.tg:hover{border-color:rgba(10,10,10,.45)}
.tg[aria-pressed=true]{border-color:var(--m70);background:rgba(10,10,10,.1);color:var(--fg)}
.tg.glyph{font-size:13px;letter-spacing:0;text-transform:none}
.tg.theme{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px}
.tg.theme .sw{display:flex;width:100%;height:24px;border-radius:2px;border:1px solid rgba(10,10,10,.1);overflow:hidden}
.tg.theme .sw i{flex:1}
.tg.theme .sw.empty{border-style:dashed;border-color:var(--l20)}
.tg.theme[disabled]{cursor:default;opacity:.55}
.tg.theme[disabled]:hover{border-color:var(--l20)}
.wide{display:block;width:100%;margin-top:8px;border:1px solid var(--l20);border-radius:4px;padding:6px 8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--m70)}
.wide:hover{border-color:rgba(10,10,10,.45)}
.ver{display:flex;align-items:center;gap:4px;margin-bottom:6px;font-size:11px}
.ver span{flex:1;letter-spacing:.08em;color:var(--m70)}
.ver button{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--m60);padding:4px 6px;border-radius:4px}
.ver button:hover,.ver button[aria-pressed=true]{background:rgba(10,10,10,.1);color:var(--fg)}
.block{margin-top:28px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;background:var(--fg);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px}
dialog{border:1px solid var(--l20);border-radius:8px;padding:0;width:min(1100px,94vw);background:#fff}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--l15)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.cmp svg{width:100%;height:auto;display:block;border:1px solid var(--l15);border-radius:4px}
.cmp h3{margin:0 0 8px;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--m70)}
@media (max-width:900px){
 body{overflow:auto}.app{flex-direction:column;height:auto}.stage{height:70vh;flex:none}.panel{width:auto;border-left:0;border-top:1px solid var(--l15)}.scroll{overflow:visible}.toolbar{flex-wrap:wrap;right:16px}.hint{display:none}
}
</style>
</head>
<body>
<div class="app">
 <main class="stage" id="tStage">
  <div class="toolbar">
   <button data-t="png">Export PNG</button><button data-t="svg">Export SVG</button><button data-t="json">Export JSON</button><i></i><button data-t="undo">Undo</button><button data-t="redo">Redo</button><i></i><button data-t="random">Random</button><button data-t="reset">Reset</button>
  </div>
  <svg class="tsvg" id="tSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Letterform composition"></svg>
  <div class="hint">Click a letter to edit it on its own. Drag to move it, arrow keys to nudge, Esc to deselect.</div>
 </main>
 <aside class="panel">
  <div class="top"><h2>Text</h2><p class="sub">Type to generate. Enter = new row.</p><textarea id="tText" rows="4" spellcheck="false" aria-label="Text"></textarea></div>
  <div class="scroll" id="tPanel"></div>
 </aside>
</div>
<dialog id="dlgCmp" aria-labelledby="dlgCmpT"><div class="dh"><h2 id="dlgCmpT">Compare versions</h2><button class="tg" data-close="dlgCmp">Close</button></div><div class="cmp" id="cmpBody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
"use strict";
/* ---------- core ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const lerp=(a,b,t)=>a+(b-a)*t;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
const pad2=n=>String(n).padStart(2,"0");
const N1=n=>Math.round(n*10)/10;
const f2=v=>(+v).toFixed(2);

const MONO='ui-monospace,SF Mono,Menlo,Consolas,monospace';
const SANS='Helvetica Neue,Helvetica,Arial,Malgun Gothic,sans-serif';
function seeded(seed){let n=(seed>>>0)||42;return()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296;};}
let toastTimer;
function notify(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200);}
function download(url,name){const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();}
function downloadJSON(obj,name){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));download(url,name);setTimeout(()=>URL.revokeObjectURL(url),15000);}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("image"));i.src=src;});}
const dateLabel=d=>{const x=new Date(d);return Number.isNaN(+x)?"":x.toLocaleDateString("en-GB",{year:"numeric",month:"2-digit",day:"2-digit"});};
const KEY="gplanet-type-v1";
function readKey(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return undefined;}}
let saveTimer,saveFailed=false;
function persist(){clearTimeout(saveTimer);let ok=true;try{localStorage.setItem(KEY,JSON.stringify(tState));}catch(e){ok=false;}if(!ok&&!saveFailed)notify("Could not save in this browser. Use Export JSON to keep your work.");saveFailed=!ok;return ok;}
function autosave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,350);}
function makeHist(snap,restore){
 return{stack:[],i:-1,t:null,
  init(){this.stack=[snap()];this.i=0;},
  flush(){clearTimeout(this.t);this.t=null;const s=snap();if(s!==this.stack[this.i]){this.stack=this.stack.slice(0,this.i+1);this.stack.push(s);if(this.stack.length>80)this.stack.shift();this.i=this.stack.length-1;}},
  push(){clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),350);},
  undo(){this.flush();if(this.i<=0)return;this.i--;restore(JSON.parse(this.stack[this.i]));},
  redo(){this.flush();if(this.i>=this.stack.length-1)return;this.i++;restore(JSON.parse(this.stack[this.i]));}
 };
}

   Letter space: cap height 0–100 (y down, baseline 100). Parts are centrelines.
================================================================ */

const NB=25,BH=4;

  const ch=Sx.text[i];if(ch==="\n"){rows.push([]);continue;}
  const st=Sx.letters[i]||tDef(ch);
  const b=ch===" "?{inner:"",adv:40,cx:20,scale:1,box:{x0:0,y0:0,x1:40,y1:100},space:true,prof:null}:tBuild(ch,st,i,ctx);

  row.forEach((it,j)=>{
   const b=it.b,kern=it.st.kern||0;it.ns=1;it.ny=0;it.nested=false;
   if(j>0)x-=(it.st.overlap||0)*b.adv*.5;

  });

   if(e.key==="ArrowLeft")st.dx-=d;if(e.key==="ArrowRight")st.dx+=d;if(e.key==="ArrowUp")st.dy-=d;if(e.key==="ArrowDown")st.dy+=d;tChanged(true);
  }
 });
 document.addEventListener("visibilitychange",()=>{if(document.hidden)persist();});
 window.addEventListener("pagehide",persist);
 new ResizeObserver(()=>tRender()).observe($("tStage"));
}
bind();syncText();tHist.init();tRender();tRenderPanel();
if(loadNote)notify(loadNote);
</script>
